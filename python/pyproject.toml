[project]
name = "aqi-attend"
version = "0.2.0"
description = "The attention layer for agents: decide when an event should wake your agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zettel Labs, Inc." }]
requires-python = ">=3.12"
dependencies = []
keywords = ["agents", "mcp", "attention", "llm", "proactive-agents", "debounce", "event-driven", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
http = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/acquiredintelligence/attend"
Repository = "https://github.com/acquiredintelligence/attend"
Issues = "https://github.com/acquiredintelligence/attend/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pyright>=1.1.390",
  "ruff>=0.8",
  "redis>=5.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqi_attend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 300
timeout_method = "thread"

[tool.pyright]
include = ["src", "tests", "bench"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 180
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PERF"]
ignore = ["A001", "A002", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/aqi_attend/store/_redis_scripts.py" = ["E501"]
"src/aqi_attend/store/postgres.py" = ["E501"]
"src/aqi_attend/judges/_defaults.py" = ["E501"]
